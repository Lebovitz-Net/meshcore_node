[metadata]
name = meshcore-node
version = 0.1.0
description = A standalone MeshCore OTA node implementation in Python.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Gregg A. Lebovitz

[options]
packages = find:
package_dir =
    = meshcore_node
python_requires = >=3.9
install_requires =
    cryptography>=41.0.0

[options.packages.find]
where = meshcore_node

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist

[mypy]
python_version = 3.9
ignore_missing_imports = True
strict_optional = True

[tool:pytest]
testpaths = tests
